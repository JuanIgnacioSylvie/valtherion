services:
  db:
    image: postgres:16-alpine
    container_name: valtherion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: valtherion
      POSTGRES_PASSWORD: valtherion
      POSTGRES_DB: valtherion
    ports:
      - "5433:5432"
    volumes:
      - valtherion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valtherion -d valtherion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valtherion_pgdata:
